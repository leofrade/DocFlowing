[project]
name = "omni-markdown-router"
version = "1.0.0"
description = "Orquestrador Inteligente MarkItDown + Marker para pipelines RAG"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Leonardo Frade" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
    "markitdown[pdf]>=0.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
marker = [
    "marker-pdf>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
omni-router = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omni_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
